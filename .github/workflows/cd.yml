name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 同步代码到服务器并部署
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p /opt/BankSYS_Pingu"
          rsync -avz --delete \
            -e "$SSH" \
            --exclude '.git' --exclude '__pycache__' --exclude '.pytest_cache' \
            --exclude '.ruff_cache' --exclude 'models' \
            ./ "$SSH_USER@$SSH_HOST:/opt/BankSYS_Pingu/"
          $SSH "$SSH_USER@$SSH_HOST" "bash /opt/BankSYS_Pingu/scripts/deploy.sh"

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 格式检查 (ruff format)
        run: ruff format --check .

      - name: 静态检查 (ruff check)
        run: ruff check .

      - name: 单元测试与覆盖率
        run: pytest --cov=bank_sys --cov-report=term-missing --cov-fail-under=80

      - name: 模型质量门禁 (AUC ≥ 0.85)
        run: PYTHONPATH=src python -m bank_sys.training --data data/train.csv --output-dir /tmp/models

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t banksys-pingu:ci .

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-sys-pingu"
version = "0.1.0"
description = "基于银行营销数据的分析与认购预测系统"
requires-python = ">=3.11"
# 生产运行依赖(与 requirements.txt 同步维护)
dependencies = [
    "streamlit>=1.36,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
]

[project.scripts]
bank-sys-train = "bank_sys.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
